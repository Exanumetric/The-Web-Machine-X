<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Web Machine X from Register</title>
</head>
<body>
    <form>
        <div class="modal-header">
            <!--Name-->
            <span class="text-success">E<span class="text-secondary">x<span class="text-success">a<span class="text-secondary">n<span class="text-secondary">u<span class="text-success">m<span class="text-secondary">e<span class="text-success">t<span class="text-secondary">r<span class="text-success">i<span class="text-secondary">c</span></span></span></span></span></span></span></span></span></span></span>
        </div>
        <div class="mb-3">
            <label for="exampleInputEmail1" class="form-label">Username</label>
            <input type="username" class="form-control" id="exampleInputUsername1" aria-describedby="usernameHelp">
        </div>
        <div class="mb-3">
            <label for="exampleInputEmail1" class="form-label">Email address</label>
            <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp">
        </div>
        <div class="mb-3">
            <label for="exampleInputPassword1" class="form-label">Password</label>
            <input type="password" class="form-control" id="exampleInputPassword1">
        </div>
        <div class="mb-3">
            <label for="exampleInputPassword1" class="form-label">Confirm password</label>
            <input type="password" class="form-control" id="exampleInputPassword1">
        </div>
        <div class="mb-3">
            <label for="exampleInputGender1" class="form-label">Gender</label>
            <!--Choose the gender-->
            <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="gender" id="genderMale" value="male" checked>
                <label class="form-check-label" for="genderMale">Male</label>
            </div>
            <!--Choose the next gender-->
            <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="gender" id="genderFemale" value="female">
                <label class="form-check-label" for="genderFemale">Female</label>
            </div>
            <!--Choose the other gender-->
            <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="gender" id="genderOther" value="other">
                <label class="form-check-label" for="genderOther">Other</label>
            </div>
        </div>
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button type="button" class="btn btn-primary">Sign up</button>
    </form>
</body>
</html>
